name: Build
on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --check src/app.js

  # Task 1 (shipping sprint) — cross-platform verification of the local LLM.
  # Qwen2.5-1.5B has only ever been built and run on ONE Windows machine.
  # This job proves llama-cpp-2 compiles AND Qwen loads + generates on the
  # other platforms, WITHOUT bundling it (bundling stays gated on user
  # decisions). macos-latest = arm64 (Metal path). NOTE: free-tier GitHub
  # gives limited macOS runner minutes — keep the Mac matrix to ONE job.
  verify-llm:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Install Linux system deps (incl. OpenMP for llama-cpp)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libglib2.0-dev libssl-dev patchelf libgomp1
      - name: Install macOS OpenMP (llama-cpp default feature)
        if: runner.os == 'macOS'
        run: brew install libomp
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: Download Qwen2.5-1.5B (pinned hash)
        run: bash scripts/download-model.sh qwen
      - name: Run lib tests (19/19)
        run: cargo test --release --lib
        working-directory: src-tauri
      - name: Smoke test — load Qwen, generate 3 titles, record timing
        run: cargo test --release --test smoke_llm -- --nocapture
        working-directory: src-tauri

  build-linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libglib2.0-dev libssl-dev patchelf libgomp1
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: bash scripts/download-model.sh
      - run: npx @tauri-apps/cli@latest build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: titleforge-linux-deb
          path: src-tauri/target/release/bundle/deb/*
          if-no-files-found: ignore

  build-linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libglib2.0-dev libssl-dev patchelf libgomp1
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: bash scripts/download-model.sh
      - run: npx @tauri-apps/cli@latest build --bundles appimage
      - uses: actions/upload-artifact@v4
        with:
          name: titleforge-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: bash scripts/download-model.sh
      - run: npx @tauri-apps/cli@latest build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: titleforge-windows
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Install OpenMP (llama-cpp default feature — not preinstalled on GH runners)
        run: brew install libomp
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: bash scripts/download-model.sh
      - run: npm install
      - run: npx @tauri-apps/cli@latest build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: titleforge-macos
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-deb, build-linux-appimage, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: titleforge-*, merge-multiple: true }
      - name: Find binaries, collect signatures, generate updates.json
        run: |
          mkdir -p dist
          find . -name "*.exe" -exec cp {} dist/ \;
          find . -name "*.dmg" -exec cp {} dist/ \;
          find . -name "*.deb" -exec cp {} dist/ \;
          find . -name "*.AppImage" -exec cp {} dist/ \;
          find . -name "*.sig" -exec cp {} dist/ \;
          
          # Determine version from tag name
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          
          echo "=== dist contents ==="
          ls -la dist/
          echo ""
          
          # Read signatures from .sig files
          SIG_WIN=""
          SIG_MAC_X64=""
          SIG_MAC_ARM=""
          SIG_LINUX=""
          for sigfile in dist/*.sig; do
            [ -f "$sigfile" ] || continue
            sigcontent=$(cat "$sigfile" | tr -d '\n')
            base=$(basename "$sigfile")
            echo "Found sig: $base"
            if echo "$base" | grep -qi "setup.exe"; then
              SIG_WIN="$sigcontent"
            elif echo "$base" | grep -qi "aarch64.dmg"; then
              SIG_MAC_ARM="$sigcontent"
            elif echo "$base" | grep -qi "x64.dmg"; then
              SIG_MAC_X64="$sigcontent"
            elif echo "$base" | grep -qi "amd64.AppImage"; then
              SIG_LINUX="$sigcontent"
            fi
          done
          
          # Build updates.json with actual signatures and resolved URLs
          cat > dist/updates.json << JSONEOF
          {
            "version": "${VER}",
            "notes": "Auto-release from CI",
            "pub_date": "$(date -u +"%Y-%m-%dT00:00:00Z")",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG_WIN}",
                "url": "https://github.com/Olammyinc/titleforge-desktop/releases/download/${{ github.ref_name }}/TitleForge_${VER}_x64-setup.exe"
              },
              "darwin-x86_64": {
                "signature": "${SIG_MAC_X64}",
                "url": "https://github.com/Olammyinc/titleforge-desktop/releases/download/${{ github.ref_name }}/TitleForge_${VER}_x64.dmg"
              },
              "darwin-aarch64": {
                "signature": "${SIG_MAC_ARM}",
                "url": "https://github.com/Olammyinc/titleforge-desktop/releases/download/${{ github.ref_name }}/TitleForge_${VER}_aarch64.dmg"
              },
              "linux-x86_64": {
                "signature": "${SIG_LINUX}",
                "url": "https://github.com/Olammyinc/titleforge-desktop/releases/download/${{ github.ref_name }}/TitleForge_${VER}_amd64.AppImage"
              }
            }
          }
          JSONEOF
          
          echo "=== updates.json ==="
          cat dist/updates.json
          echo ""
          
          # Warn about missing signatures (not fatal — Tauri v2 sig gen depends on key format)
          if [ -z "$SIG_WIN" ]; then echo "WARNING: Windows signature missing — auto-update may not install without verification"; fi
          if [ -z "$SIG_MAC_X64" ]; then echo "WARNING: macOS x64 signature missing"; fi
          if [ -z "$SIG_MAC_ARM" ]; then echo "WARNING: macOS ARM signature missing"; fi
          if [ -z "$SIG_LINUX" ]; then echo "WARNING: Linux signature missing"; fi
          echo ""
          ls -la dist/
      - uses: softprops/action-gh-release@v2
        with:
          name: TitleForge v${{ github.ref_name }}
          body: "Generated release with signed binaries and auto-update manifest."
          files: dist/*
          generate_release_notes: true
      - name: Deploy updates.json to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "No NETLIFY_AUTH_TOKEN secret set — skipping Netlify deploy."
            echo "To enable auto-deploy, add your Netlify PAT to repo secrets."
            exit 0
          fi
          SITE_ID="titleforge-tool"
          # Read file, escape for JSON string
          UPDATES_JSON=$(cat dist/updates.json | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          curl -s -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"files\": {\"/updates.json\": $UPDATES_JSON}}" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID/deploys" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deployed:', d.get('ssl_url','?'))"
