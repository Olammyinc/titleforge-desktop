<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TitleForge — Judge Calibration</title>
<style>
  :root {
    --ink:#0B0A0A; --paper:#F9F7F2; --forge:#E8782B; --forge-glow:#FF9147;
    --cool:#5B7B8A; --success:#5C8A67; --border:#E5DFD5; --muted:#8A847A;
    --ease: cubic-bezier(0.16,1,0.3,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Satoshi', system-ui, sans-serif; background:var(--paper);
    color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  .header {
    padding:28px 40px 20px; border-bottom:1px solid var(--border);
    display:flex; align-items:flex-end; justify-content:space-between;
  }
  .header h1 { font-family:'Clash Display', sans-serif; font-size:24px; font-weight:600; }
  .header p { color:var(--muted); font-size:13px; margin-top:4px; }
  .progress-wrap { width:220px; }
  .progress-label { font-size:12px; color:var(--muted); margin-bottom:6px; text-align:right; }
  .progress-bar { height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--forge); width:0%; transition:width 200ms var(--ease); }
  .main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; gap:24px; }
  .context { font-size:14px; color:var(--muted); }
  .context strong { color:var(--ink); }
  .pair-row { display:flex; gap:20px; width:100%; max-width:960px; align-items:stretch; }
  .title-card {
    flex:1; background:#fff; border:1px solid var(--border); border-radius:12px;
    padding:36px 28px; text-align:center; cursor:pointer; min-height:220px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Clash Display', sans-serif; font-size:20px; line-height:1.4;
    transition:transform 150ms var(--ease), box-shadow 150ms var(--ease), border-color 150ms var(--ease);
  }
  .title-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(11,10,10,0.08); border-color:var(--forge); }
  .title-card.selected { border-color:var(--forge); background:rgba(232,120,43,0.05); }
  .card-label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); margin-bottom:14px; font-family:'Satoshi', sans-serif; }
  .hint { font-size:12px; color:var(--muted); }
  .hint kbd { background:#fff; border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-family:'JetBrains Mono', monospace; font-size:11px; }
  .done { text-align:center; }
  .done h2 { font-family:'Clash Display', sans-serif; font-size:28px; margin-bottom:12px; }
  .done p { color:var(--muted); max-width:520px; margin:0 auto 20px; line-height:1.6; }
  .btn {
    background:var(--forge); color:#fff; border:none; border-radius:8px;
    padding:12px 28px; font-size:15px; font-weight:600; cursor:pointer;
    font-family:'Satoshi', sans-serif; transition:filter 150ms var(--ease);
  }
  .btn:hover { filter:brightness(1.08); }
  .btn-ghost {
    background:#fff; color:var(--ink); border:1px solid var(--border);
    padding:8px 16px; font-size:13px; border-radius:8px; cursor:pointer;
    font-family:'Satoshi', sans-serif;
  }
  .btn-ghost:hover { border-color:var(--forge); color:var(--forge); }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>TitleForge — Judge Calibration</h1>
    <p>Which title would a creator actually publish? Pick the better one.</p>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span id="doneCount">0</span> / 35</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</div>

<div class="main" id="main"></div>

<script>
const PAIRS = [{"id": 40, "keyword": "coffee", "category": "product", "titleA": "Start Your Day Brewed: A Journey Through Coffee", "titleB": "Drinking Coffee Like a Brave Explorer"}, {"id": 22, "keyword": "minimalism", "category": "book", "titleA": "The $2,000 a Month Minimalist", "titleB": "Minimalism: Finding Balance in the Modern World"}, {"id": 142, "keyword": "remote work", "category": "blog", "titleA": "5 Tips for Thriving in Remote Work", "titleB": "What if Remote Work Became the New Normal?"}, {"id": 144, "keyword": "startup", "category": "book", "titleA": "The Startup Whisperer: Uncovering Hidden Secrets to Success", "titleB": "Startup's Guide to Uncharted Ventures"}, {"id": 120, "keyword": "coffee", "category": "product", "titleA": "19 Reasons Why You Need Coffee Today", "titleB": "'A Day in the Life: How Coffee Captivated Me"}, {"id": 141, "keyword": "tea", "category": "product", "titleA": "Why I Switched From Coffee to Tea (And How It Changed My Afternoons)", "titleB": "Tea Time: Discover the Blissful Brews That Transform Your Day"}, {"id": 82, "keyword": "AI", "category": "article", "titleA": "The AI Tutor That Passed 1,000 Law Exams — And What It Means for Your Job", "titleB": "AI Will Never Be Creative: The Human Brain's Irreplaceable Edge"}, {"id": 66, "keyword": "remote work", "category": "blog", "titleA": "How to Thrive as a Remote Worker in Today's Digital Age", "titleB": "10 Reasons Why Remote Work Isn't Just a Trend, It's Here to Stay"}, {"id": 167, "keyword": "coffee", "category": "product", "titleA": "Drinks vs. Coffee: Why Bitter Is the New Sweet", "titleB": "Fuel for the Mind: The Essential Coffee Awakening"}, {"id": 23, "keyword": "board games", "category": "product", "titleA": "The 5 Board Games That Ruined My Family Night (And Why We Keep Playing)", "titleB": "How I Transform Board games and That will blow your mind"}, {"id": 27, "keyword": "virtual reality", "category": "youtube", "titleA": "Unleash the Future: Exploring Virtual Reality", "titleB": "Exploring the Future: Discover Virtual Reality's Potential"}, {"id": 59, "keyword": "marketing", "category": "article", "titleA": "Stop Romanticizing Hustle Culture: It's Just Exhaustion with Better Marketing", "titleB": "The $0 Marketing Tactic That Tripled Our Signups in 30 Days"}, {"id": 153, "keyword": "coffee", "category": "product", "titleA": "Morning Muse: Brew Strong Coffee, Feel Lighter", "titleB": "Zen Breakers: How Coffee Cures Your Workday Blues"}, {"id": 51, "keyword": "digital nomad", "category": "blog", "titleA": "The $2,847 Mistake That Nearly Ended My Digital Nomad Life", "titleB": "The Rise of 'Digital Nomad' Communities in Southeast Asia"}, {"id": 100, "keyword": "coffee", "category": "product", "titleA": "Every Moment a Brew: Discovering Blissful Coffee", "titleB": "Everyday Bliss: Coffee"}, {"id": 164, "keyword": "coffee", "category": "product", "titleA": "Every Morning's First Comfort: Decoding the Magic in My Coffee", "titleB": "Did You Ever Wonder Why Coffee Is Called Coffee?"}, {"id": 192, "keyword": "remote work", "category": "blog", "titleA": "Remote Bliss: Thriving Without Boundaries", "titleB": "From Freelance to Flatland: My Journey into Remote Work"}, {"id": 64, "keyword": "remote work", "category": "blog", "titleA": "From Joining the Office to Remote: My Journey", "titleB": "Remote Work Revolution: What Really Sets Teams Apart"}, {"id": 151, "keyword": "podcasting", "category": "blog", "titleA": "Podcast Revolution: Discovering Hidden Gems in Your Favorite Shows", "titleB": "Exploring the Podium: Tips for Launching and Thriving in the Podcasting Scene"}, {"id": 159, "keyword": "tennis", "category": "youtube", "titleA": "Why Planes Tennis YouTube Videos", "titleB": "Why I Switched to a $200 Tennis Racket (and You Should Too)"}, {"id": 145, "keyword": "remote work", "category": "blog", "titleA": "What Does Remote Work Mean to You?", "titleB": "Remote Work: The Future Is Now, Not Just Possible"}, {"id": 42, "keyword": "coffee", "category": "product", "titleA": "Coffee: From Dark Humor, Brighter Morning", "titleB": "Is Coffee the Best Brain Boost of All Time?"}, {"id": 108, "keyword": "coffee", "category": "product", "titleA": "What Does Coffee Really Do For Your Brain?", "titleB": "Revitalize Your Day with the Perfect Cup of Coffee"}, {"id": 0, "keyword": "remote work", "category": "blog", "titleA": "5 Tips for Thriving in Remote Work", "titleB": "What is the Future of Remote Work?"}, {"id": 34, "keyword": "meditation", "category": "podcast", "titleA": "6 Ways to Reduce Anxiety Without Meditation", "titleB": "Mindful Moments: Unlocking the Power of Meditation"}, {"id": 92, "keyword": "writing", "category": "book", "titleA": "The Unexpected Benefit of Writing by Hand", "titleB": "The First Draft Is a Lie"}, {"id": 163, "keyword": "laptop", "category": "product", "titleA": "Does This Make Laptop Pale Morning", "titleB": "The 3 Laptop Specs That Matter More Than Speed"}, {"id": 121, "keyword": "remote work", "category": "blog", "titleA": "Why Remote Work Failed for Me (and 3 Fixes That Worked)", "titleB": "Remote Work: The Future of Flexibility or a Mirage?"}, {"id": 21, "keyword": "ethical fashion", "category": "blog", "titleA": "The Hidden Cost of Fast Fashion", "titleB": "Why Ethical fashion Is More Rich Than You Think"}, {"id": 24, "keyword": "minimalism", "category": "book", "titleA": "The $2,000 a Month Minimalist", "titleB": "Why Do Ocean Train Minimalism?"}, {"id": 154, "keyword": "jazz", "category": "song", "titleA": "The Fast Jazz Gold That That will blow your mind", "titleB": "Notes of Midnight: Jazz Dreams"}, {"id": 104, "keyword": "blockchain", "category": "article", "titleA": "Revolutionizing Finance: How Blockchain is Shaping the Future of Money", "titleB": "9 Ways Blockchain Will Transform Your Science"}, {"id": 191, "keyword": "coffee", "category": "product", "titleA": "Why Is Drinking Coffee Good For You?", "titleB": "Start Your Day Brewed: A Journey Through Coffee"}, {"id": 26, "keyword": "coffee", "category": "product", "titleA": "Drinking Life: Discover the Magic of Everyday Coffees", "titleB": "Start Your Day Brewed: A Journey Through Coffee"}, {"id": 186, "keyword": "coffee", "category": "product", "titleA": "Is Coffee the Best Brain Boost of All Time?", "titleB": "Start Your Day with the Roasted Happiness: A Guide to Blissful Coffee Exploration"}];
const STORE_KEY = 'titleforge_judge_pairs_v1';
let answers = {};
try {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved) answers = JSON.parse(saved);
} catch (e) {}

let idx = 0;
while (idx < PAIRS.length && answers[PAIRS[idx].id] !== undefined) idx++;

const main = document.getElementById('main');

function render() {
  if (idx >= PAIRS.length) { renderDone(); return; }
  const p = PAIRS[idx];
  document.getElementById('doneCount').textContent = Object.keys(answers).length;
  document.getElementById('progressFill').style.width =
    (Object.keys(answers).length / PAIRS.length * 100) + '%';

  main.innerHTML =
    '<div class="context">Keyword: <strong>' + esc(p.keyword) + '</strong> · Category: <strong>' + esc(p.category) + '</strong></div>' +
    '<div class="pair-row">' +
      '<div class="title-card" data-side="a" tabindex="0"><div><div class="card-label">Title A</div>' + esc(p.titleA) + '</div></div>' +
      '<div class="title-card" data-side="b" tabindex="0"><div><div class="card-label">Title B</div>' + esc(p.titleB) + '</div></div>' +
    '</div>' +
    '<div class="hint">Click a title, press <kbd>←</kbd>/<kbd>→</kbd>, or press <kbd>A</kbd>/<kbd>B</kbd>. Skip with <kbd>S</kbd>.</div>';

  document.querySelectorAll('.title-card').forEach(function (card) {
    card.addEventListener('click', function () { choose(card.getAttribute('data-side')); });
  });
}

function choose(side) {
  const p = PAIRS[idx];
  answers[p.id] = side;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(answers)); } catch (e) {}
  idx++;
  while (idx < PAIRS.length && answers[PAIRS[idx].id] !== undefined) idx++;
  render();
}

function skip() {
  const p = PAIRS[idx];
  answers[p.id] = 'skip';
  try { localStorage.setItem(STORE_KEY, JSON.stringify(answers)); } catch (e) {}
  idx++;
  while (idx < PAIRS.length && answers[PAIRS[idx].id] !== undefined) idx++;
  render();
}

function renderDone() {
  document.getElementById('doneCount').textContent = PAIRS.length;
  document.getElementById('progressFill').style.width = '100%';
  const n = Object.keys(answers).filter(k => answers[k] === 'a' || answers[k] === 'b').length;
  main.innerHTML =
    '<div class="done">' +
      '<h2>All pairs labelled</h2>' +
      '<p>' + n + ' of ' + PAIRS.length + ' answered. Download the results, then run the analysis step (calibrate_judge.py) to correlate your taste against the judge.</p>' +
      '<button class="btn" onclick="download()">Download Results (JSON)</button>' +
    '</div>';
}

function download() {
  const rows = PAIRS.filter(p => answers[p.id] !== undefined).map(p => ({
    id: p.id, keyword: p.keyword, category: p.category, titleA: p.titleA, titleB: p.titleB, choice: answers[p.id]
  }));
  const blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'judge-retest-user-labels.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', function (e) {
  if (idx >= PAIRS.length) return;
  const k = e.key.toLowerCase();
  if (k === 'a' || k === 'arrowleft') { e.preventDefault(); choose('a'); }
  else if (k === 'b' || k === 'arrowright') { e.preventDefault(); choose('b'); }
  else if (k === 's') { e.preventDefault(); skip(); }
});

render();
</script>
</body>
</html>
